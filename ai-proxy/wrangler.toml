name = "financial-planner-ai-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Check the current free-tier model name in Google AI Studio before deploying.
GEMINI_MODEL = "gemini-2.5-flash"

# Per-IP limit on top of the Gemini free quota.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Secrets (never in this file): GEMINI_API_KEY, APP_TOKEN — set with `wrangler secret put`.
