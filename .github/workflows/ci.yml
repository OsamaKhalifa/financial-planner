name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no runtime data in repo
        run: |
          if git ls-files | grep -Ei '\.(db|sqlite3?)(-wal|-shm|-journal)?$|\.backup\.json$|^local/'; then
            echo "Runtime data file is tracked — remove it."; exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --no-pub --coverage

  ai-proxy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-proxy/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
